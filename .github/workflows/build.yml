name: RetroTV Pad build
on: [workflow_dispatch, pull_request]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # v3 installs the removed "tools" package by default and fails on current runners.
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: bash ./gradlew :retropad:assembleDebug :retropad:testDebugUnitTest :retropad:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RetroTV-Pad-debug
          path: retropad/build/outputs/apk/debug/retropad-debug.apk